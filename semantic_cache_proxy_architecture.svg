<svg width="100%" viewBox="0 0 680 620" role="img">
  <title>Semantic Cache Proxy API Architecture</title>
  <desc>Flowchart showing request lifecycle through a semantic caching proxy, from client through FastAPI, embedding generation, Redis cache check, and optional LLM call.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Client -->
  <g class="node c-gray">
    <rect x="260" y="20" width="160" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="42" text-anchor="middle" dominant-baseline="central">Client</text>
  </g>

  <!-- Arrow: Client → Auth -->
  <line x1="340" y1="64" x2="340" y2="98" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="352" y="86" dominant-baseline="central">POST /chat</text>

  <!-- Auth Middleware -->
  <g class="node c-purple">
    <rect x="230" y="98" width="220" height="52" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="117" text-anchor="middle" dominant-baseline="central">Auth middleware</text>
    <text class="ts" x="340" y="136" text-anchor="middle" dominant-baseline="central">API key validation</text>
  </g>

  <!-- Arrow: Auth → Embed -->
  <line x1="340" y1="150" x2="340" y2="184" class="arr" marker-end="url(#arrow)"/>

  <!-- Embedding Service -->
  <g class="node c-teal">
    <rect x="210" y="184" width="260" height="52" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="203" text-anchor="middle" dominant-baseline="central">Embedding service</text>
    <text class="ts" x="340" y="222" text-anchor="middle" dominant-baseline="central">sentence-transformers (local)</text>
  </g>

  <!-- Arrow: Embed → Cache Check -->
  <line x1="340" y1="236" x2="340" y2="270" class="arr" marker-end="url(#arrow)"/>

  <!-- Cache Lookup -->
  <g class="node c-amber">
    <rect x="210" y="270" width="260" height="52" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="289" text-anchor="middle" dominant-baseline="central">Cache lookup</text>
    <text class="ts" x="340" y="308" text-anchor="middle" dominant-baseline="central">cosine similarity &gt; 0.92?</text>
  </g>

  <!-- HIT branch -->
  <line x1="210" y1="296" x2="80" y2="296" class="arr" marker-end="url(#arrow)" stroke="#1D9E75"/>
  <text class="ts" x="146" y="286" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">HIT</text>

  <!-- Hit response box -->
  <g class="node c-teal">
    <rect x="20" y="270" width="120" height="52" rx="8" stroke-width="0.5"/>
    <text class="th" x="80" y="289" text-anchor="middle" dominant-baseline="central">Return cached</text>
    <text class="ts" x="80" y="308" text-anchor="middle" dominant-baseline="central">response + savings</text>
  </g>

  <!-- MISS branch arrow down -->
  <line x1="340" y1="322" x2="340" y2="356" class="arr" marker-end="url(#arrow)" stroke="#D85A30"/>
  <text class="ts" x="352" y="344" dominant-baseline="central" fill="#993C1D">MISS</text>

  <!-- LLM Call -->
  <g class="node c-coral">
    <rect x="210" y="356" width="260" height="52" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="375" text-anchor="middle" dominant-baseline="central">LLM call</text>
    <text class="ts" x="340" y="394" text-anchor="middle" dominant-baseline="central">OpenAI / any provider</text>
  </g>

  <!-- Arrow: LLM → Store -->
  <line x1="340" y1="408" x2="340" y2="442" class="arr" marker-end="url(#arrow)"/>

  <!-- Store in Redis -->
  <g class="node c-blue">
    <rect x="210" y="442" width="260" height="52" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="461" text-anchor="middle" dominant-baseline="central">Store in Redis</text>
    <text class="ts" x="340" y="480" text-anchor="middle" dominant-baseline="central">prompt + embedding + TTL</text>
  </g>

  <!-- Arrow: Store → Return -->
  <line x1="340" y1="494" x2="340" y2="528" class="arr" marker-end="url(#arrow)"/>

  <!-- Return Response -->
  <g class="node c-gray">
    <rect x="230" y="528" width="220" height="52" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="547" text-anchor="middle" dominant-baseline="central">Return response</text>
    <text class="ts" x="340" y="566" text-anchor="middle" dominant-baseline="central">+ log metrics</text>
  </g>

  <!-- Redis side box -->
  <g class="node c-blue">
    <rect x="530" y="270" width="130" height="224" rx="10" stroke-width="0.5"/>
    <text class="th" x="595" y="295" text-anchor="middle" dominant-baseline="central">Redis</text>
    <text class="ts" x="595" y="315" text-anchor="middle" dominant-baseline="central">Vector store</text>
    <text class="ts" x="595" y="355" text-anchor="middle" dominant-baseline="central">• Embeddings</text>
    <text class="ts" x="595" y="375" text-anchor="middle" dominant-baseline="central">• Responses</text>
    <text class="ts" x="595" y="395" text-anchor="middle" dominant-baseline="central">• TTL per entry</text>
    <text class="ts" x="595" y="415" text-anchor="middle" dominant-baseline="central">• Hit/miss stats</text>
    <text class="ts" x="595" y="455" text-anchor="middle" dominant-baseline="central">HNSW index</text>
  </g>

  <!-- Dotted line: Cache lookup ↔ Redis -->
  <line x1="470" y1="296" x2="530" y2="296" stroke-dasharray="4 3" stroke-width="1" stroke="var(--color-text-secondary)" marker-end="url(#arrow)"/>
  <!-- Dotted line: Store → Redis -->
  <line x1="470" y1="468" x2="530" y2="440" stroke-dasharray="4 3" stroke-width="1" stroke="var(--color-text-secondary)" marker-end="url(#arrow)"/>

  <!-- Metrics endpoint label -->
  <text class="ts" x="340" y="608" text-anchor="middle" dominant-baseline="central">GET /metrics — hit rate · tokens saved · avg latency</text>
</svg>
